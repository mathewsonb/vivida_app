name: Vivida Autonomous ETL Pipeline

on:
  schedule:
    # Runs daily at 11:00 UTC (3:00 AM PST / 4:00 AM PDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Chrome & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl zstd xvfb xauth libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          wget -q -O /tmp/google-chrome-stable.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome-stable.deb
          rm -f /tmp/google-chrome-stable.deb
          google-chrome --version

      - name: Cache Ollama Models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-gemma3-4b-${{ runner.os }}

      - name: Install Ollama & Pull gemma3:4b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 15); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull gemma3:4b

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Master ETL Pipeline Suite & Build Running Summary
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          xvfb-run -a python vivida_etl/pipeline_runner.py 2>&1 | tee /tmp/etl_full_run.log

          python - << 'EOF'
          import datetime
          import os
          import re
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("America/Los_Angeles")
          now_str = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S %Z")

          with open("/tmp/etl_full_run.log", "r", encoding="utf-8", errors="ignore") as f:
              raw_log = f.read()

          task_pattern = re.compile(r"---\s*\[\d+/\d+\]\s*Running Task:\s*(.+?)\s*\((.+?)\)\s*---")
          matches = list(task_pattern.finditer(raw_log))

          succeeded = []
          attention_needed = []

          for i, m in enumerate(matches):
              task_name, module_name = m.group(1).strip(), m.group(2).strip()
              start_idx = m.end()
              end_idx = matches[i + 1].start() if i + 1 < len(matches) else len(raw_log)
              block = raw_log[start_idx:end_idx]

              has_fatal = bool(
                  re.search(
                      r"\[(?:FATAL ERROR|PIPELINE ERROR|CRITICAL)\]|Execution error for|Standalone pipeline execution failed|Traceback \(most recent call last\)",
                      block,
                  )
              )
              no_events = bool(re.search(r"No events returned|No events scraped|Found 0 .* event", block))

              count_match = re.search(
                  r"Total records synchronized:\s*(\d+/\d+)|Successfully scraped\s+(\d+)\s+raw events",
                  block,
                  re.I,
              )
              if count_match:
                  count_val = count_match.group(1) or f"{count_match.group(2)} events"
                  count_str = f"{count_val} synced"
              else:
                  count_str = "completed"

              if has_fatal:
                  err_line = next(
                      (ln.strip() for ln in block.splitlines() if "ERROR" in ln or "CRITICAL" in ln or "Exception:" in ln),
                      "Execution error",
                  )
                  attention_needed.append(f"  [ERROR] {task_name} ({module_name}) -> {err_line[:140]}")
              elif no_events:
                  attention_needed.append(f"  [0 EVENTS] {task_name} ({module_name}) -> Returned 0 events (check selectors/API)")
              else:
                  succeeded.append(f"  [OK] {task_name} ({module_name}) -> {count_str}")

          lines = [
              "=" * 78,
              f"VIVIDA DAILY ETL SUMMARY | {now_str}",
              f"Tasks Run: {len(matches)} | Healthy: {len(succeeded)} | Needs Attention: {len(attention_needed)}",
              "-" * 78,
          ]

          if attention_needed:
              lines.append("ACTION NEEDED:")
              lines.extend(attention_needed)
              lines.append("-" * 78)

          lines.append("HEALTHY MODULES:")
          lines.extend(succeeded if succeeded else ["  (None parsed)"])
          lines.append("=" * 78 + "\n\n")

          summary_block = "\n".join(lines)
          print(summary_block)

          log_path = "etl_daily_summary.log"
          existing = ""
          if os.path.exists(log_path):
              with open(log_path, "r", encoding="utf-8") as f:
                  existing = f.read()

          # Prepend newest run at the top and cap at 2,500 lines
          combined = (summary_block + existing).splitlines()[:2500]
          with open(log_path, "w", encoding="utf-8") as f:
              f.write("\n".join(combined) + "\n")
          EOF

      - name: Upload Full Raw Run Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etl-raw-log-${{ github.run_number }}
          path: /tmp/etl_full_run.log
          retention-days: 14

      - name: Commit Daily Summary Log to Repo Root
        run: |
          git config user.name "vivida-etl-bot"
          git config user.email "vivida-etl-bot@users.noreply.github.com"
          git add etl_daily_summary.log
          if ! git diff --staged --quiet; then
            git commit -m "chore(etl): update daily run summary log [skip ci]"
            git push
          fi