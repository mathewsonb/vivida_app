[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivida-utils"
version = "0.1.0"
description = "Vivida Event Pipeline and Scraper Helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "beautifulsoup4",
    "selenium",
    "undetected-chromedriver",
    "requests",
    "supabase"
]

[tool.setuptools.packages.find]
where = ["."]